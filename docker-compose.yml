services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    environment:
      MONGO_URL: mongodb://mongo:27017/changeboard
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-in-prod}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
